<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'" />
<title>Slice dataset preview</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    padding: 2rem 1rem;
    background: #0b0d12;
    color: #e6e6e6;
    font-family: system-ui, sans-serif;
  }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0; }
  .stage {
    width: min(60vh, 90vw);
    aspect-ratio: 1 / 1;
    background: #05060a;
    border: 1px solid #262b36;
    border-radius: 12px;
    overflow: hidden;
  }
  .stage img { width: 100%; height: 100%; display: block; }
  .controls {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    width: min(60vh, 90vw);
  }
  input[type="range"] { flex: 1; }
  .readout { min-width: 6ch; text-align: right; font-variant-numeric: tabular-nums; }
  button {
    background: #1b2130;
    border: 1px solid #333c4d;
    color: inherit;
    border-radius: 6px;
    padding: 0.4rem 0.7rem;
    cursor: pointer;
    font: inherit;
  }
  button:hover { background: #262f42; }
  .error { color: #ffc0c0; max-width: 60ch; text-align: center; font-size: 0.9rem; }
</style>
</head>
<body>
  <h1>Slice dataset preview</h1>
  <div class="stage"><img id="frame" alt="MRI-like slice" /></div>
  <div class="controls">
    <button id="play">Play</button>
    <input id="scrub" type="range" min="1" value="1" step="1" />
    <span class="readout" id="readout">1 / ?</span>
  </div>

  <script src="preview.js"></script>
</body>
</html>
